<!doctype html><meta charset="utf-8"><title>TRACE Java tests</title>
<pre id="out" style="font:13px ui-monospace,Menlo,monospace;padding:16px;white-space:pre-wrap">running…</pre>
<script type="module">
  import * as JavaParser from 'https://cdn.jsdelivr.net/npm/java-parser@3.0.1/+esm';
  window.JavaParser = JavaParser;
  window.dispatchEvent(new Event('java-parser-ready'));
</script>
<script src="../js/java-preamble.js?v=3"></script>
<script src="../js/java-instrument.js?v=2"></script>
<script src="../js/java-runner.js?v=2"></script>
<script src="../js/java-driver.js?v=1"></script>
<script>
const out = document.getElementById('out');
const fails = []; let n = 0;
function eq(name, actual, expected){
  n++;
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if(a !== e) fails.push(`FAIL: ${name}\n  expected ${e}\n  actual   ${a}`);
}
function ok(name, cond, detail){ n++; if(!cond) fails.push(`FAIL: ${name}${detail?'\n  '+detail:''}`); }
function report(){ out.textContent = fails.length ? fails.join('\n\n') : `ALL PASS (${n})`; }

(async function(){
 try {
  /* ── Task 1: card parser ── */
  const stdout = [
    '__T{"line":5,"locals":{"count":0},"grids":{},"lists":{}}',
    'some unrelated program output',
    '__T{"line":7,"locals":{"count":1},"grids":{},"lists":{}}',
    '__RESULT{3}'
  ].join('\n');
  const r = parseCards(stdout);
  eq('parseCards count', r.snapshots.length, 2);
  eq('parseCards first line', r.snapshots[0].line, 5);
  eq('parseCards ignores noise', r.snapshots[1].locals.count, 1);
  eq('parseCards result', r.result, 3);
  eq('parseCards has_result', r.has_result, true);

  /* ── Task 1: real JVM ── */
  const hello = 'public class Main{public static void main(String[] a){System.out.println(42);}}';
  const j = await judge0Run(hello);
  eq('judge0 stdout', (j.stdout||'').trim(), '42');
  eq('judge0 clean compile', j.compileOutput, null);
  ok('judge0 under 15s', j.timeMs < 15000, `took ${Math.round(j.timeMs)}ms`);

  /* ── Task 2: preamble classifies values into renderer buckets ── */
  const prog = JAVA_PREAMBLE + `
public class Main {
${JAVA_PREAMBLE_ALIASES}
  public static void main(String[] args){
    int[] arr = {1,2,3};
    char[][] g = {{'1','0'},{'0','1'}};
    java.util.Map<String,Integer> m = new java.util.HashMap<>();
    m.put("a", 1);
    java.util.Set<Integer> s = new java.util.HashSet<>();
    s.add(7);
    java.util.List<Integer> li = new java.util.ArrayList<>();
    li.add(5);
    ListNode ln = __H.buildList(new int[]{1,2,3});
    __t(4, "arr", arr, "g", g, "m", m, "s", s, "li", li, "ln", ln, "total", 9);
    System.out.println("__RESULT{" + __ser(9) + "}");
  }
}`;
  const jr = await judge0Run(prog);
  ok('preamble compiles', jr.compileOutput === null, 'compile said: ' + jr.compileOutput);
  if(jr.compileOutput){ report(); return; }
  const pc = parseCards(jr.stdout);
  eq('one card emitted', pc.snapshots.length, 1);
  const c = pc.snapshots[0] || {locals:{},lists:{},grids:{},dicts:{},sets:{},linked_lists:{}};
  eq('int -> locals',        c.locals.total, 9);
  eq('int[] -> lists',       c.lists.arr, [1,2,3]);
  eq('char[][] -> grids',    c.grids.g, [['1','0'],['0','1']]);
  eq('Map -> dicts',         c.dicts.m, {a:1});
  eq('Set -> sets',          c.sets.s, [7]);
  eq('List -> lists',        c.lists.li, [5]);
  /* not a plain array: the bucket carries {nodes:[{id,val}],cycle_to},
     which is what renderers.js rLL destructures */
  eq('ListNode -> linked_lists values', (c.linked_lists.ln.nodes||[]).map(n=>n.val), [1,2,3]);
  eq('result parsed',        pc.result, 9);

  /* ── call tree node shape must match tracer.js:409-410 exactly, or
        renderers-recursion.js renders "undefined" and an empty tree ── */
  const ctProg = JAVA_PREAMBLE + `
public class Main {
${JAVA_PREAMBLE_ALIASES}
  static int fib(int n){
    __enter("fib", "n", n);
    if(n<2){ __exit(n); return n; }
    int r = fib(n-1) + fib(n-2);
    __exit(r); return r;
  }
  public static void main(String[] a){
    int r = fib(4);
    System.out.println("__RESULT{" + __ser(r) + "}");
  }
}`;
  const cj = await judge0Run(ctProg);
  ok('call tree prog compiles', cj.compileOutput === null, 'compile said: ' + cj.compileOutput);
  const roots = buildCallTrees(cj.stdout);
  eq('one root call', roots.length, 1);
  const rt = roots[0] || {};
  eq('uses .func not .fn', rt.func, 'fib');
  eq('args are repr strings', rt.args, { n: '4' });
  eq('has .ctx', typeof rt.ctx, 'object');
  eq('uses .return_val', rt.return_val, 3);
  eq('sets .returned', rt.returned, true);
  eq('root not memo', rt.is_memo, false);
  eq('root has 2 children', rt.children.length, 2);
  ok('detects a memo hit', JSON.stringify(roots).includes('"is_memo":true'),
     'fib(4) recomputes fib(2), so some node must be flagged is_memo');
  eq('fib(4) result', parseCards(cj.stdout).result, 3);

  /* ── Tasks 4 and 5: parsing, scoping, injection ── */
  if(!window.JavaParser) await new Promise(r => addEventListener('java-parser-ready', r, {once:true}));

  const jsrc = `public class Solution {
  public int numIslands(char[][] grid) {
    int rows = grid.length;
    int count = 0;
    for (int r = 0; r < rows; r++) {
      int inner = r * 2;
      if (grid[r][0] == '1') count++;
    }
    return count;
  }
}`;
  const pj = parseJava(jsrc);
  ok('java parses', pj.error === null, String(pj.error));

  const decls = collectDecls(pj.cst);
  const names = decls.map(d => d.name).sort();
  eq('finds params and locals', names, ['count','grid','inner','r','rows']);

  eq('line 4 scope', liveAt(decls, 4).sort(), ['count','grid','rows']);
  ok('loop var live inside the loop', liveAt(decls, 6).includes('r'), JSON.stringify(liveAt(decls,6)));
  ok('loop var dead after the loop', !liveAt(decls, 8).includes('r'), JSON.stringify(liveAt(decls,8)));
  ok('inner dead after the loop', !liveAt(decls, 8).includes('inner'), JSON.stringify(liveAt(decls,8)));

  const inst = instrumentJava(jsrc);
  ok('instrument succeeds', inst.error === null, String(inst.error));
  ok('injects trace calls', /__Tracer\.t\(\d+,/.test(inst.code), 'no trace call');
  ok('injects an enter call', /__Tracer\.enter\("numIslands"/.test(inst.code), 'no enter call');
  ok('original code preserved', inst.code.includes('int count = 0;'), 'original line lost');
  ok('never injects after return', !/return count;\s*\n\s*__Tracer\.t/.test(inst.code),
     'injected unreachable code after return');
  ok('no unsupported in plain code', inst.unsupported.length === 0, JSON.stringify(inst.unsupported));

  /* The braceless-loop trap: injecting by "line ends in a semicolon" would
     emit __t(i) after the loop, where i is out of scope. Must compile. */
  const braceless = `public class Solution {
  public int total(int[] a) {
    int sum = 0;
    for (int i = 0; i < a.length; i++)
      sum += a[i];
    return sum;
  }
}`;
  const bi = instrumentJava(braceless);
  ok('braceless loop instruments', bi.error === null, String(bi.error));
  const bprog = JAVA_PREAMBLE + '\n' +
    bi.code.replace('public class Solution','class Solution') + `
public class Main {
${JAVA_PREAMBLE_ALIASES}
  public static void main(String[] x){
    int[] a = {1,2,3};
    System.out.println("__RESULT{" + __ser(new Solution().total(a)) + "}");
  }
}`;
  const bj = await judge0Run(bprog);
  ok('braceless loop COMPILES', bj.compileOutput === null, 'compile said: ' + bj.compileOutput);
  eq('braceless loop result', parseCards(bj.stdout).result, 6);

  const si = instrumentJava('public class S{ int f(java.util.List<Integer> l){ return l.stream().mapToInt(Integer::intValue).sum(); } }');
  ok('detects streams', si.unsupported.includes('streams'), JSON.stringify(si.unsupported));

  /* ── Task 6: driver builder ── */
  const sigSrc = `public class Solution {
  public int numIslands(char[][] grid) { return 0; }
}`;
  const d1 = buildJavaDriver(sigSrc, 'grid = [["1","0"],["0","1"]]');
  ok('driver built', d1.error === null, String(d1.error));
  ok('declares char[][] literally', /char\[\]\[\] grid = \{\{'1','0'\},\{'0','1'\}\};/.test(d1.driver), d1.driver);
  ok('calls the method', /numIslands\(grid\)/.test(d1.driver), d1.driver);
  ok('prints a result', d1.driver.includes('__RESULT'), d1.driver);

  const d2 = buildJavaDriver('public class Solution{ public int[] twoSum(int[] nums, int target){ return null; } }',
                             'nums = [2,7,11]\ntarget = 9');
  ok('int[] literal', /int\[\] nums = \{2,7,11\};/.test(d2.driver), d2.driver);
  ok('scalar literal', /int target = 9;/.test(d2.driver), d2.driver);
  ok('both args passed', /twoSum\(nums, target\)/.test(d2.driver), d2.driver);

  const d3 = buildJavaDriver('public class Solution{ public ListNode reverseList(ListNode head){ return null; } }',
                             'head = [1,2,3]');
  ok('ListNode built via helper', /__H\.buildList\(new int\[\]\{1,2,3\}\)/.test(d3.driver), d3.driver);

  const d4 = buildJavaDriver('public class Solution{ public int maxDepth(TreeNode root){ return 0; } }',
                             'root = [3,9,20,null,null,15,7]');
  ok('TreeNode built with nulls', /__H\.buildTree\(new Integer\[\]\{3,9,20,null,null,15,7\}\)/.test(d4.driver), d4.driver);

  const d5 = buildJavaDriver(sigSrc, 'wrongName = [[1]]');
  ok('missing input is an error', !!d5.error && d5.error.includes('grid'), String(d5.error));

  /* ── Structure buckets are NOT plain arrays ──
     tracer.js stores {nodes:[{id,val}],cycle_to} and nested
     {id,val,left,right}; renderers.js destructures exactly those, so an
     array here makes rLL throw on nodes.length. */
  const structProg = JAVA_PREAMBLE + `
public class Main {
  public static void main(String[] a){
    ListNode l = __H.buildList(new int[]{1,2,3});
    TreeNode t = __H.buildTree(new Integer[]{3,9,20,null,null,15,7});
    __Tracer.t(1, "l", l, "t", t);
    System.out.println("__RESULT{0}");
  }
}`;
  const sj = await judge0Run(structProg);
  ok('struct program compiles', sj.compileOutput === null, 'compile said: ' + sj.compileOutput);
  ok('no runtime NPE on tree', !sj.stderr, String(sj.stderr).slice(0,120));
  const sc = parseCards(sj.stdout).snapshots[0] || { linked_lists:{}, trees:{} };
  ok('linked list is an object not an array', !Array.isArray(sc.linked_lists.l),
     JSON.stringify(sc.linked_lists.l));
  ok('linked list has .nodes', Array.isArray(sc.linked_lists.l && sc.linked_lists.l.nodes),
     JSON.stringify(sc.linked_lists.l));
  eq('linked list values', (sc.linked_lists.l.nodes||[]).map(n=>n.val), [1,2,3]);
  eq('cycle_to null when acyclic', sc.linked_lists.l.cycle_to, null);
  ok('nodes carry ids', (sc.linked_lists.l.nodes||[]).every(n => typeof n.id === 'number'),
     JSON.stringify(sc.linked_lists.l.nodes));
  ok('tree is nested not level order', !Array.isArray(sc.trees.t), JSON.stringify(sc.trees.t));
  eq('tree root value', sc.trees.t && sc.trees.t.val, 3);
  eq('tree left child', sc.trees.t && sc.trees.t.left && sc.trees.t.left.val, 9);
  eq('tree right child', sc.trees.t && sc.trees.t.right && sc.trees.t.right.val, 20);
  eq('tree grandchild', sc.trees.t && sc.trees.t.right.left && sc.trees.t.right.left.val, 15);

  report();
 } catch(e){ out.textContent = 'THREW: ' + e.message + '\n' + e.stack; }
})();
</script>
